<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spot the Difference</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="./index.css" />
</head>

<body>
    <!-- Password Screen -->
    <div id="passwordScreen" class="password-screen">
        <div class="password-container">
            <h2>Enter Code</h2>
            <div class="otp-inputs">
                <input type="text" class="otp-input" maxlength="1" inputmode="numeric" />
                <input type="text" class="otp-input" maxlength="1" inputmode="numeric" />
                <input type="text" class="otp-input" maxlength="1" inputmode="numeric" />
                <input type="text" class="otp-input" maxlength="1" inputmode="numeric" />
            </div>
            <button id="passwordButton">Unlock</button>
            <p id="passwordError" style="color: gray; display: none; margin-top: 10px; font-size: 0.9rem;">Incomplete code</p>
        </div>
    </div>

    <!-- Instruction Screen -->
    <div id="instructionScreen" class="password-screen hidden">
        <div class="password-container text-center">
            <h2>How to Play</h2>
            <div class="space-y-4 my-6 text-[#3b3b37] font-sans">
                <p>There are <strong>4 stages</strong> to complete.</p>
                <p>In each stage, find the <strong>2 AI-generated</strong> images to reveal a digit.</p>
                <p class="text-sm text-red-500">Careful: If you flip a "Real" image, you will be sent back to Stage 1.</p>
            </div>
            <button id="startGameButton">Start Game</button>
        </div>
    </div>

    <!-- Quiz Content -->
    <div id="quizContent" class="quiz-hidden">
        <div>
            <h1 class="heading">Can you spot the fake?</h1>
        </div>
        
        <!-- Stage Indicator -->
        <div id="stageIndicator" style="text-align:center; margin-bottom: 20px; font-size: 0.9rem; color: #999; font-weight: 500; letter-spacing: 0.05em;">
            Stage <span id="stageNumber">1</span> of 4
        </div>

        <!-- Change max-width from 95% to 98% -->
<div style="width:100%; max-width:98%; display:flex; flex-direction:column; gap:20px; align-items:center;">
        <!-- Card Grid -->
        <div id="cardGrid" style="display: grid; gap: 12px; grid-template-columns: repeat(3, 1fr);">
            <!-- Cards will be generated by JavaScript -->
        </div>

        <!-- Hint -->
        <div style="text-align:center;">
            <span id="hint">Find all the AI-generated images</span>
        </div>

        <!-- 3-digit code area: 3 circles under each digit -->
        <div id="codeArea">
            <!-- Digit 1 -->
            <div class=" code-digit-group">
            <div class="digit-placeholder" id="digit1">?</div>
            <div class="digit-line"></div>
            <div class="circle-row">
                <div class="prog-circle" id="circle1">
                    <div class="c-fill"></div>
                    <div class="c-icon"></div>
                    <div class="c-dot"></div>
                </div>
                <div class="prog-circle" id="circle2">
                    <div class="c-fill"></div>
                    <div class="c-icon"></div>
                    <div class="c-dot"></div>
                </div>
                <div class="prog-circle" id="circle3">
                    <div class="c-fill"></div>
                    <div class="c-icon"></div>
                    <div class="c-dot"></div>
                </div>
            </div>
        </div>
        <!-- Digit 2 -->
        <div class="code-digit-group">
            <div class="digit-placeholder" id="digit2">?</div>
            <div class="digit-line"></div>
            <div class="circle-row">
                <div class="prog-circle" id="circle4">
                    <div class="c-fill"></div>
                    <div class="c-icon"></div>
                    <div class="c-dot"></div>
                </div>
                <div class="prog-circle" id="circle5">
                    <div class="c-fill"></div>
                    <div class="c-icon"></div>
                    <div class="c-dot"></div>
                </div>
                <div class="prog-circle" id="circle6">
                    <div class="c-fill"></div>
                    <div class="c-icon"></div>
                    <div class="c-dot"></div>
                </div>
            </div>
        </div>
        <!-- Digit 3 -->
        <div class="code-digit-group">
            <div class="digit-placeholder" id="digit3">?</div>
            <div class="digit-line"></div>
            <div class="circle-row">
                <div class="prog-circle" id="circle7">
                    <div class="c-fill"></div>
                    <div class="c-icon"></div>
                    <div class="c-dot"></div>
                </div>
                <div class="prog-circle" id="circle8">
                    <div class="c-fill"></div>
                    <div class="c-icon"></div>
                    <div class="c-dot"></div>
                </div>
                <div class="prog-circle" id="circle9">
                    <div class="c-fill"></div>
                    <div class="c-icon"></div>
                    <div class="c-dot"></div>
                </div>
            </div>
        </div>
        <!-- Digit 4 -->
        <div class="code-digit-group">
            <div class="digit-placeholder" id="digit4">?</div>
            <div class="digit-line"></div>
            <div class="circle-row">
                <div class="prog-circle" id="circle10">
                    <div class="c-fill"></div>
                    <div class="c-icon"></div>
                    <div class="c-dot"></div>
                </div>
                <div class="prog-circle" id="circle11">
                    <div class="c-fill"></div>
                    <div class="c-icon"></div>
                    <div class="c-dot"></div>
                </div>
                <div class="prog-circle" id="circle12">
                    <div class="c-fill"></div>
                    <div class="c-icon"></div>
                    <div class="c-dot"></div>
                </div>
            </div>
        </div>
    </div>

    </div>
    <script src="./script.js"></script>
</body>

</html>
