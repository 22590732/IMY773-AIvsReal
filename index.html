<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Memory Game</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="./index.css" />
    </head>

    <body>
        <!-- Password Screen -->
        <div id="passwordScreen" class="password-screen">
            <div class="password-container">
                <h2>Enter Code</h2>
                <div class="otp-inputs">
                    <input
                        type="text"
                        class="otp-input"
                        maxlength="1"
                        inputmode="numeric"
                    />
                    <input
                        type="text"
                        class="otp-input"
                        maxlength="1"
                        inputmode="numeric"
                    />
                    <input
                        type="text"
                        class="otp-input"
                        maxlength="1"
                        inputmode="numeric"
                    />
                    <input
                        type="text"
                        class="otp-input"
                        maxlength="1"
                        inputmode="numeric"
                    />
                </div>
                <button id="passwordButton">Unlock</button>
                <p
                    id="passwordError"
                    style="
                        color: gray;
                        display: none;
                        margin-top: 10px;
                        font-size: 0.9rem;
                    "
                >
                    Incomplete code
                </p>
            </div>
        </div>

        <!-- Game Content -->
        <div id="gameContent" class="quiz-hidden">
            <div>
                <h1 class="heading">Match the Pairs</h1>
                <p
                    id="roundCounter"
                    style="
                        text-align: center;
                        color: #3b3b37;
                        margin: -24px 0 16px 0;
                        font-size: 0.9rem;
                    "
                >
                    Round 1/4
                </p>
            </div>

            <div
                style="
                    width: 100%;
                    max-width: 1200px;
                    display: flex;
                    flex-direction: column;
                    gap: 20px;
                "
            >
                <!-- Memory Game Grid -->
                <div id="gameGrid" class="memory-grid"></div>

                <!-- Next Round Button -->
                <button
                    id="nextRoundBtn"
                    class="next-round-btn"
                    style="display: none"
                >
                    Next Round
                </button>
            </div>

            <!-- Code Area - Hidden until final reveal -->
            <div id="codeArea" style="display: none">
                <!-- Digit 1 -->
                <div class="code-digit-group">
                    <div class="digit-placeholder" id="digit1">?</div>
                    <div class="digit-line"></div>
                    <div class="circle-row">
                        <div class="prog-circle" id="circle1">
                            <div class="c-fill"></div>
                            <div class="c-icon"></div>
                            <div class="c-dot"></div>
                        </div>
                        <div class="prog-circle" id="circle2">
                            <div class="c-fill"></div>
                            <div class="c-icon"></div>
                            <div class="c-dot"></div>
                        </div>
                        <div class="prog-circle" id="circle3">
                            <div class="c-fill"></div>
                            <div class="c-icon"></div>
                            <div class="c-dot"></div>
                        </div>
                    </div>
                </div>
                <!-- Digit 2 -->
                <div class="code-digit-group">
                    <div class="digit-placeholder" id="digit2">?</div>
                    <div class="digit-line"></div>
                    <div class="circle-row">
                        <div class="prog-circle" id="circle4">
                            <div class="c-fill"></div>
                            <div class="c-icon"></div>
                            <div class="c-dot"></div>
                        </div>
                        <div class="prog-circle" id="circle5">
                            <div class="c-fill"></div>
                            <div class="c-icon"></div>
                            <div class="c-dot"></div>
                        </div>
                        <div class="prog-circle" id="circle6">
                            <div class="c-fill"></div>
                            <div class="c-icon"></div>
                            <div class="c-dot"></div>
                        </div>
                    </div>
                </div>
                <!-- Digit 3 -->
                <div class="code-digit-group">
                    <div class="digit-placeholder" id="digit3">?</div>
                    <div class="digit-line"></div>
                    <div class="circle-row">
                        <div class="prog-circle" id="circle7">
                            <div class="c-fill"></div>
                            <div class="c-icon"></div>
                            <div class="c-dot"></div>
                        </div>
                        <div class="prog-circle" id="circle8">
                            <div class="c-fill"></div>
                            <div class="c-icon"></div>
                            <div class="c-dot"></div>
                        </div>
                        <div class="prog-circle" id="circle9">
                            <div class="c-fill"></div>
                            <div class="c-icon"></div>
                            <div class="c-dot"></div>
                        </div>
                    </div>
                </div>
                <!-- Digit 4 -->
                <div class="code-digit-group">
                    <div class="digit-placeholder" id="digit4">?</div>
                    <div class="digit-line"></div>
                    <div class="circle-row">
                        <div class="prog-circle" id="circle10">
                            <div class="c-fill"></div>
                            <div class="c-icon"></div>
                            <div class="c-dot"></div>
                        </div>
                        <div class="prog-circle" id="circle11">
                            <div class="c-fill"></div>
                            <div class="c-icon"></div>
                            <div class="c-dot"></div>
                        </div>
                        <div class="prog-circle" id="circle12">
                            <div class="c-fill"></div>
                            <div class="c-icon"></div>
                            <div class="c-dot"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="./script.js"></script>
    </body>
</html>
